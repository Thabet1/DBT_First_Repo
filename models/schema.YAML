version: 2

models:
  - name: Stg_Company
    description: "Staging model containing company information from the raw company source."

    columns:
      - name: company_id
        description: "Unique identifier for the company."
        tests:
          - not_null
          - unique

      - name: company_name
        description: "Name of the company."

      - name: link
        description: "URL associated with the company."